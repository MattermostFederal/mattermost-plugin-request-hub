# Runs the SBOM + Grype scan and CodeQL static analysis on every PR
# and every push to main. Uploads SARIF results to GitHub code scanning
# so findings show up inline on PRs and in the Security tab.
#
# Build is gated:
#   - Grype: --fail-on high blocks HIGH/CRITICAL CVEs
#   - CodeQL: make security-gate fails on error-level SARIF findings
#   - govulncheck: fails on known vulnerabilities in code the plugin calls
#   - SARIF upload to Code Scanning: required, no bypass
#
# REQUIREMENT: GitHub Code Scanning must be enabled on the repo.
#   - Public repos: free, enable via Settings -> Code security and analysis
#   - Private repos: requires GitHub Advanced Security (paid, Enterprise plan)
# Without it, the SARIF upload step will fail and the workflow will go red.
# That is intentional — security findings must reach the Security tab so
# reviewers can see them inline on the PR.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Re-run weekly to catch newly-disclosed CVEs even when no code changes.
    # GHSA / NVD update continuously; we'd otherwise only notice on the
    # next PR, which may be weeks away for a stable plugin.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write  # upload SARIF to code scanning
  actions: read

jobs:
  sbom-scan:
    name: SBOM + Grype vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The web app SBOM lists what npm installed, so install it first.
      # It only reads the installed packages, so install scripts are skipped.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install webapp dependencies
        run: cd webapp && npm ci --ignore-scripts

      - name: Generate SBOM
        run: make sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/sbom/
          retention-days: 30

      # Run Grype directly (rather than via make) so we can emit SARIF
      # for GitHub code scanning. `make sbom-scan` emits table output
      # only — useful for humans, not for the code scanning API.
      - name: Scan server SBOM with Grype (SARIF output)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v6.7.0
        id: grype-server
        with:
          sbom: dist/sbom/server-sbom.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      # Runs even when the server scan fails, so both results are reported.
      - name: Scan webapp SBOM with Grype (SARIF output)
        if: ${{ !cancelled() && hashFiles('dist/sbom/webapp-sbom.json') != '' }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v6.7.0
        id: grype-webapp
        with:
          sbom: dist/sbom/webapp-sbom.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      # Upload is required, not best-effort. If Code Scanning isn't
      # enabled on this repo, the step fails and the workflow goes red
      # — by design. Enable Code Scanning in repo settings (public:
      # free; private: needs GHAS).
      # Best-effort: Code Scanning needs a public repo or GitHub Advanced
      # Security. On a private repo without GHAS this upload 403s — don't
      # fail the job for it. The hard CVE gate is the Grype scan above
      # (fail-build: true on HIGH); this step only feeds the Security tab.
      - name: Upload server Grype SARIF to code scanning
        if: always() && steps.grype-server.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.grype-server.outputs.sarif }}
          category: grype

      - name: Upload webapp Grype SARIF to code scanning
        if: always() && steps.grype-webapp.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.grype-webapp.outputs.sarif }}
          category: grype-webapp

      - name: Upload server Grype SARIF as workflow artifact
        if: always() && steps.grype-server.outputs.sarif != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-sarif
          path: ${{ steps.grype-server.outputs.sarif }}
          retention-days: 30

      - name: Upload webapp Grype SARIF as workflow artifact
        if: always() && steps.grype-webapp.outputs.sarif != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-webapp-sarif
          path: ${{ steps.grype-webapp.outputs.sarif }}
          retention-days: 30

  codeql:
    name: CodeQL static analysis (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Generate the gitignored server/manifest.go before the traced build
      # so CodeQL compiles and analyzes the full server package.
      - name: Generate manifest
        run: go run ./build/manifest apply

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          # Index from repo root so root-package files (main.go,
          # docs_embed.go, runbooks_embed.go) are covered. The Go
          # module is rooted at the repo root — server/ is just a
          # package inside it, not a separate module.

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      # Split analysis from upload so each step's success/failure has
      # one clear meaning. `upload: never` writes SARIF locally; the
      # explicit security-gate step then enforces the finding threshold,
      # and the upload step pushes results to GitHub Code Scanning.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        id: codeql-analyze
        with:
          category: codeql-go
          upload: never
          output: codeql-results

      # Stage the SARIF where `make security-gate` looks for it
      # (dist/codeql-*.sarif). The Make target parses the SARIF
      # for level=error findings and fails CI if any are present.
      # Same gate as `make release` runs locally.
      - name: Run security gate (fail on critical/high findings)
        run: |
          mkdir -p dist
          cp codeql-results/*.sarif dist/codeql-go.sarif
          make security-gate

      # Best-effort: needs a public repo or GitHub Advanced Security. On a
      # private repo without GHAS this 403s — don't fail the job. The hard
      # gate is `make security-gate` above; this only feeds the Security tab.
      - name: Upload CodeQL SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: codeql-results
          category: codeql-go

      - name: Upload CodeQL SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: codeql-results/
          retention-days: 30

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Same check `make release` gates on, so a finding shows up on the PR
      # rather than at release time.
      - name: Run govulncheck
        run: make govulncheck
