# Fires on a v* tag push (normally created when the release-please PR is
# merged). Runs the full security-gated release pipeline via `make
# release`, which chains:
#   release-check -> clean -> all -> sbom-audit -> govulncheck -> codeql-analyze
#   -> security-gate -> release-bundle -> virus-scan -> release-sign
#   -> release-checksum
#
# The published tarball ships with SBOMs (sbom/) and CodeQL SARIF
# (security/) embedded, plus a sha256 sidecar and, when a signing key
# is configured, a detached GPG signature. The build job runs the same
# `make release` a developer runs locally, without the key. The publish
# job signs, checksums and publishes in the `release` environment, runs
# no code from the repository, and is the only job that sees the key.
#
# To ship manually instead of via release-please:
#   1. Bump plugin.json version + add a CHANGELOG.md entry (commit them)
#   2. git tag -a v0.2.0 -m "release v0.2.0" && git push origin v0.2.0
name: Release

on:
  push:
    tags:
      - 'v*'
  # Called by release-please.yml when it creates a release. release-please
  # tags with GITHUB_TOKEN, whose events can't trigger the push:tags path
  # above (GitHub anti-recursion), so it invokes this workflow directly.
  workflow_call:
    inputs:
      tag:
        description: Tag to build and publish (set by the release-please caller).
        required: true
        type: string
    # Least privilege: the caller passes only the signing secrets this
    # workflow uses (not `secrets: inherit`, which would forward all of them).
    # Optional — release-sign is a no-op when they're unset.
    secrets:
      PLUGIN_SIGNING_KEY:
        description: GPG private key used to sign the release bundle.
        required: false
      PLUGIN_SIGNING_KEY_PASSPHRASE:
        description: Passphrase for PLUGIN_SIGNING_KEY.
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest-4-cores
    permissions:
      contents: read
      security-events: write
    outputs:
      plugin_name: ${{ steps.plugin_info.outputs.plugin_name }}
      plugin_version: ${{ steps.plugin_info.outputs.plugin_version }}
      bundle_name: ${{ steps.plugin_info.outputs.bundle_name }}
    env:
      # Effective tag: the workflow_call input when release-please invokes
      # us, else the pushed tag's short name. Used for checkout, release
      # tag_name, notes, and prerelease detection so both paths match.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the release tag explicitly — required on the
          # workflow_call path, where the run's ref is main, not the tag.
          ref: ${{ env.RELEASE_TAG }}
          # action-gh-release generates notes from git history between
          # tags; the default depth-1 checkout makes those notes empty.
          fetch-depth: 0
          # Don't leave the git token in the workspace — later steps run
          # third-party code (npm ci, playwright, Go builds) and this job
          # never pushes. action-gh-release uses GITHUB_TOKEN directly.
          persist-credentials: false

      # Resolve the checked-out tag's commit SHA so the SARIF uploads can
      # attribute findings to the release tag, not the caller's ref (which is
      # main on the workflow_call path).
      - name: Resolve release SHA
        id: relsha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refuse a tag that is not on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$RELEASE_TAG points at a commit that is not on main."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install webapp dependencies
        run: cd webapp && npm ci

      - name: Install Playwright browsers
        run: cd webapp && npx playwright install --with-deps chromium

      # Pre-install ClamAV and seed its DB so `make virus-scan` finds
      # clamscan already present. freshclam is best-effort — the apt
      # package ships a baseline DB, so a failed update won't sink the
      # release.
      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam || true

      # The whole security-gated pipeline in one target — keeps CI and
      # local `make release` identical.
      - name: Build release (full security pipeline)
        run: make release

      - name: Get plugin info
        id: plugin_info
        run: |
          PLUGIN_ID=$(build/bin/manifest id)
          PLUGIN_VERSION=$(build/bin/manifest version)
          PLUGIN_NAME=$(build/bin/manifest name)
          BUNDLE_NAME="${PLUGIN_ID}-${PLUGIN_VERSION}.tar.gz"
          echo "plugin_id=${PLUGIN_ID}" >> "$GITHUB_OUTPUT"
          echo "plugin_version=${PLUGIN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "plugin_name=${PLUGIN_NAME}" >> "$GITHUB_OUTPUT"
          echo "bundle_name=${BUNDLE_NAME}" >> "$GITHUB_OUTPUT"

      # Push CodeQL findings to the Security tab for this release ref.
      # Best-effort per-language — a webapp-only or server-only plugin
      # won't produce both SARIFs.
      - name: Upload Go CodeQL SARIF to code scanning
        if: always() && hashFiles('dist/codeql-go.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: dist/codeql-go.sarif
          category: codeql-go-release
          # Attribute to the release tag/commit, not the caller ref (main on
          # the workflow_call path).
          ref: refs/tags/${{ env.RELEASE_TAG }}
          sha: ${{ steps.relsha.outputs.sha }}

      - name: Upload JS/TS CodeQL SARIF to code scanning
        if: always() && hashFiles('dist/codeql-js.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: dist/codeql-js.sarif
          category: codeql-js-release
          # Attribute to the release tag/commit, not the caller ref (main on
          # the workflow_call path).
          ref: refs/tags/${{ env.RELEASE_TAG }}
          sha: ${{ steps.relsha.outputs.sha }}

      - name: Hand the release files to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            plugin.json
            dist/${{ steps.plugin_info.outputs.bundle_name }}
            dist/sbom/server-sbom.json
            dist/sbom/webapp-sbom.json
            dist/codeql-go.sarif
            dist/codeql-js.sarif
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files

      - name: Sign and checksum the bundles
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          PLUGIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.PLUGIN_SIGNING_KEY_PASSPHRASE }}
          BUNDLES: ${{ needs.build.outputs.bundle_name }}
        run: |
          set -euo pipefail
          key_id=""
          if [ -n "$PLUGIN_SIGNING_KEY" ]; then
            GNUPGHOME="$(mktemp -d)"
            export GNUPGHOME
            printf '%s\n' "$PLUGIN_SIGNING_KEY" | gpg --batch --import
            key_id="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')"
            if [ -z "$key_id" ]; then
              echo "::error::PLUGIN_SIGNING_KEY contains no usable secret key."
              exit 1
            fi
          fi
          cd dist
          for bundle in $BUNDLES; do
            [ -f "$bundle" ] || { echo "::error::Missing release bundle: $bundle"; exit 1; }
            if [ -n "$key_id" ]; then
              printf '%s' "$PLUGIN_SIGNING_KEY_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                -u "$key_id" --personal-digest-preferences SHA256 --detach-sign "$bundle"
            fi
            sha256sum "$bundle" > "$bundle.sha256"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Pin the target tag — on the workflow_call path github.ref is main,
          # so the action's default (github.ref) would target the wrong ref.
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ needs.build.outputs.plugin_name }} v${{ needs.build.outputs.plugin_version }}
          files: |
            dist/${{ needs.build.outputs.bundle_name }}
            dist/${{ needs.build.outputs.bundle_name }}.sha256
            dist/${{ needs.build.outputs.bundle_name }}.sig
            dist/sbom/server-sbom.json
            dist/sbom/webapp-sbom.json
            dist/codeql-go.sarif
            dist/codeql-js.sarif
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc') || contains(env.RELEASE_TAG, '-beta') || contains(env.RELEASE_TAG, '-alpha') }}
          body: |
            ## ${{ needs.build.outputs.plugin_name }} ${{ env.RELEASE_TAG }}

            See [`CHANGELOG.md`](${{ github.server_url }}/${{ github.repository }}/blob/${{ env.RELEASE_TAG }}/CHANGELOG.md) for curated release notes.

            ### Install

            1. Download `${{ needs.build.outputs.bundle_name }}` from the assets below.
            2. (Optional) Verify the checksum:
               ```bash
               sha256sum -c ${{ needs.build.outputs.bundle_name }}.sha256
               ```
            3. (Optional) Verify the GPG signature, if a `.sig` is attached:
               ```bash
               gpg --verify ${{ needs.build.outputs.bundle_name }}.sig ${{ needs.build.outputs.bundle_name }}
               ```
            4. Upload via **System Console → Plugin Management → Choose File → Enable**.

            ### Supply-chain artifacts

            - **SBOM** (CycloneDX JSON): `server-sbom.json` / `webapp-sbom.json` list every dependency in the shipped bundle. Also embedded under `sbom/` inside the tarball.
            - **CodeQL SARIF**: `codeql-go.sarif` / `codeql-js.sarif` are the static-analysis results that gated this build. Also embedded under `security/` inside the tarball.

            ### Auto-generated changelog
