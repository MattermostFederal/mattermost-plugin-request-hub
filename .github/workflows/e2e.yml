# Runs the Playwright suite in e2e/ against a real Mattermost server: the
# PR's `make dist` bundle is installed on an unlicensed Enterprise image
# started by testcontainers (same pattern as mattermost-plugin-agents and
# mattermost-plugin-boards). Not a required check yet; add it to the main
# ruleset once it has proven stable.
name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Set the MM_IMAGE repository variable to test another server image;
      # defaults to the tag docker-compose.dev.yml uses.
      MM_IMAGE: ${{ vars.MM_IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js for the webapp build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Build bundle
        run: make dist

      # testcontainers needs Node >= 22, so e2e/ has its own .nvmrc.
      - name: Set up Node.js for e2e
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        run: cd e2e && npm ci

      - name: TypeScript check
        run: cd e2e && npm run check-types

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Playwright e2e tests
        run: cd e2e && npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload server logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-logs
          path: e2e/logs/
          retention-days: 14
